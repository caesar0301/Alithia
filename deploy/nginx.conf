# Alithia reverse-proxy configuration
# Sits in front of the FastAPI/Uvicorn backend to provide rate limiting,
# scanner-path blocking, and security headers.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --------------- Rate limiting ---------------
    # 10 req/s per client IP, shared across workers.
    limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;

    # Hide server identity
    server_tokens off;

    # --------------- Upstream ---------------
    upstream alithia {
        server alithia:8080;
    }

    server {
        listen 80;
        server_name _;

        # --------------- Security headers ---------------
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
        add_header X-XSS-Protection        "1; mode=block"                   always;

        # --------------- Block scanner paths ---------------
        # Drop the connection silently (444) for known vulnerability probes.
        location ~ /\.env  { return 444; }
        location ~ /\.git  { return 444; }
        location ~ \.php   { return 444; }
        location /wp-content/ { return 444; }
        location /wp-admin/   { return 444; }
        location /wp-login.php { return 444; }
        location = /credentials.json     { return 444; }
        location = /credentials.json.map { return 444; }
        location = /config.env           { return 444; }

        # --------------- Main proxy ---------------
        location / {
            limit_req zone=global burst=20 nodelay;

            proxy_pass http://alithia;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }
    }
}

name: Release alithia-agent

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/alithia-agent

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Get package version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | sed 's/version = "//' | sed 's/"//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on PyPI
        id: pypi-check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking if alithia-agent $VERSION exists on PyPI..."
          if pip index versions alithia-agent 2>/dev/null | grep -q "$VERSION"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $VERSION already exists on PyPI, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✓ Version $VERSION not found on PyPI, will publish"
          fi

      - name: Run tests
        if: steps.pypi-check.outputs.exists == 'false'
        run: uv run pytest tests/ -v

      - name: Build package
        if: steps.pypi-check.outputs.exists == 'false'
        run: uv build

      - name: Verify dist directory
        if: steps.pypi-check.outputs.exists == 'false'
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist directory not found"
            exit 1
          fi
          if [ -z "$(ls -A dist | grep -E 'alithia')" ]; then
            echo "❌ Error: dist directory doesn't contain alithia-agent packages"
            exit 1
          fi
          echo "✓ dist directory exists and contains alithia-agent packages"
          ls -la dist/ | grep -E 'alithia'

      - name: Publish to PyPI
        if: steps.pypi-check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          print-hash: true

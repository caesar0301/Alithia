[project]
name = "alithia"
version = "0.3.2"
description = "CLI research assistant for paper discovery and analysis"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "Alithia Team"}]

dependencies = [
    "soothe-nano>=1.0.8,<1.1.0",
    "soothe-sdk>=1.0,<2.0",
    "arxiv>=2.0.0",
    "pyzotero>=1.5.0",
    "fastembed>=0.6.0,<1.0.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "docling>=2.0.0",
    "deepxiv-sdk>=0.1.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
alithia-agent = "alithia.__main__:main"

# Soothe plugin entry points
[project.entry-points."soothe.plugins"]
paperscout = "alithia.paperscout:PaperScoutPlugin"
paperlens = "alithia.paperlens:PaperLensPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alithia"]

[tool.hatch.build.targets.sdist]
include = ["src/alithia/", "nano.yml", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# Third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "arxiv",
    "yaml",
    "pyzotero",
    "fastembed",
    "sklearn.*",
    "docling.*",
    "modelscope.*",
    "langchain_core.*",
    "soothe_nano.*",
    "soothe_sdk.*",
    "deepxiv_sdk.*",
    "httpx",
]
ignore_missing_imports = true
